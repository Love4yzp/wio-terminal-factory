[platformio]
default_envs = wio_terminal

[env:wio_terminal]
platform = atmelsam
board = seeed_wio_terminal
framework = arduino
monitor_speed = 115200
build_flags = -Wall
lib_ldf_mode = deep+
lib_deps =
    seeed-studio/Seeed Arduino rpcWiFi
    seeed-studio/Seeed Arduino rpcUnified
    seeed-studio/Seeed_Arduino_mbedtls
    seeed-studio/Seeed Arduino FS
    seeed-studio/Seeed Arduino SFUD
    seeed-studio/Grove-3-Axis-Digital-Accelerometer-2g-to-16g-LIS3DHTR
extra_scripts =
    pre:scripts/build_id.py
    post:scripts/uf2.py
